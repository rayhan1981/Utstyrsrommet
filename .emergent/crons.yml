crons:
  - name: trial-reminders
    description: "Sender e-postpåminnelse dag 5 og dag 7 av 7-dagers Deluxe-prøveperiode"
    cron: "0 9 * * *"
    timezone: "Europe/Oslo"
    endpoint: "{{BASE_URL}}/api/cron/trial-reminders"
    method: POST
    enabled: true

  - name: due-date-reminders
    description: "Varsler lagleder 14/7 dager før frist og 1 dag etter forfall for utstyr som ikke er returnert (PDF vedlagt)"
    cron: "0 8 * * *"
    timezone: "Europe/Oslo"
    endpoint: "{{BASE_URL}}/api/cron/due-date-reminders"
    method: POST
    enabled: true
